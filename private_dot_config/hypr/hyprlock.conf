general {
  hide_cursor = true
  ignore_empty_input = true
  immediate_render = true
}

background {
  monitor =
  path = screenshot
  color = rgba(17, 17, 27, 1.0)
  blur_passes = 2
  blur_size = 6
  noise = 0.02
  contrast = 0.9
  brightness = 0.7
  vibrancy = 0.2
}

label {
  monitor =
  text = $TIME
  color = rgba(205, 214, 244, 1.0)
  font_size = 86
  font_family = JetBrains Mono
  position = 0, 90
  halign = center
  valign = center
}

label {
  monitor =
  text = $USER
  color = rgba(205, 214, 244, 1.0)
  font_size = 20
  font_family = JetBrains Mono
  position = 0, 20
  halign = center
  valign = center
}

input-field {
  monitor =
  size = 320, 58
  outline_thickness = 2
  dots_size = 0.22
  dots_spacing = 0.25
  dots_center = true
  outer_color = rgba(245, 194, 231, 1.0)
  inner_color = rgba(30, 30, 46, 0.75)
  font_color = rgba(205, 214, 244, 1.0)
  font_family = JetBrains Mono
  placeholder_text = <i>Contrasenya</i>
  fail_text = <i>Contrasenya incorrecta ($ATTEMPTS)</i>
  check_color = rgba(166, 227, 161, 1.0)
  fail_color = rgba(243, 139, 168, 1.0)
  rounding = 8
  position = 0, -50
  halign = center
  valign = center
}
